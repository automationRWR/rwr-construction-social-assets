<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Poppins';font-weight:300;src:url(poppins-latin-300-normal.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-weight:400;src:url(poppins-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-weight:500;src:url(poppins-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Poppins';font-weight:600;src:url(poppins-latin-600-normal.woff2) format('woff2')}
:root{--pk:#E6007E;--ink:#1D1D1F;--grey:#6E6E73}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;font-family:'Poppins',Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{width:1080px;height:1350px;position:relative;overflow:hidden}
.logo{position:absolute;left:50%;top:52px;width:250px;transform:translateX(-50%)}
.photo{position:absolute;left:90px;top:190px;width:900px;height:610px;border-radius:40px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 62%;display:block}
.hl{position:absolute;left:90px;top:850px;font-size:96px;font-weight:600;letter-spacing:-.02em;line-height:1.05;color:var(--ink);white-space:nowrap}
.hl span{display:block}.hl .k{color:var(--pk)}
.sub{position:absolute;left:90px;top:1080px;font-size:36px;font-weight:300;line-height:1.4;color:var(--grey);white-space:nowrap}
.pill{position:absolute;left:90px;top:1210px;padding:22px 52px;border-radius:999px;font-size:34px;font-weight:500;background:var(--pk);color:#fff;white-space:nowrap}
</style></head><body>
<img class="logo" src="logo_full.png">
<div class="photo"><img src="photo.jpg"></div>
<div class="hl"><span>Plans on paper.</span><span class="k">People on site.</span></div>
<div class="sub">The project leaders who make the plan happen.<br>We know where they are.</div>
<div class="pill">Brief us this week</div>
</body></html>
